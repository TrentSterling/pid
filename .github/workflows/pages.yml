name: Publish and verify Physics Gym

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  actions: read

concurrency:
  group: pid-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate the static application
        shell: bash
        run: |
          set -euo pipefail
          for asset in index.html styles.css app.js sim.js scene.js canvas-scene.js; do
            test -s "$asset"
          done
          test -f .nojekyll
          for module in app.js sim.js scene.js canvas-scene.js; do
            node --input-type=module --check < "$module"
          done
          for module in vr/*.js; do
            node --input-type=module --check < "$module"
          done
          node tests/simulation.mjs
          node --test vr/tests/*.mjs
          python3 scripts/validate-deliverables.py

      - name: Fast-forward the publishing branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          if ! git merge-base --is-ancestor origin/gh-pages "$GITHUB_SHA"; then
            echo '::error::gh-pages has independent commits. Reconcile them before publishing; no history was overwritten.'
            exit 1
          fi
          git push origin "$GITHUB_SHA:refs/heads/gh-pages"

      - name: Request and await the exact Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Explicitly request publication instead of relying on the branch push.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --jq '{status: .status, url: .url}'
          # Native Pages jobs may queue for several minutes. Match only the
          # native workflow, publishing branch, and exact source revision.
          deadline=$((SECONDS + 600))
          failed_polls=0
          previous_state=''
          while (( SECONDS < deadline )); do
            if runs="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs" -f head_sha="$GITHUB_SHA" -f event=dynamic -f per_page=100 --jq '.workflow_runs')"; then
              native_runs="$(jq --arg sha "$GITHUB_SHA" '[.[] | select(.head_sha == $sha and .head_branch == "gh-pages" and .event == "dynamic" and .path == "dynamic/pages/pages-build-deployment")]' <<< "$runs")"
              success_url="$(jq -r '[.[] | select(.status == "completed" and .conclusion == "success")] | sort_by(.id) | last | .html_url // empty' <<< "$native_runs")"
              if [ -n "$success_url" ]; then
                echo "GitHub Pages deployed ${GITHUB_SHA}: ${success_url}"
                exit 0
              fi
              state="$(jq -r 'sort_by(.id) | reverse | map("\(.id):\(.status)/\(.conclusion // "pending")") | join(", ")' <<< "$native_runs")"
              if [ "$state" != "$previous_state" ]; then
                echo "Waiting for native Pages deployment: ${state:-not yet listed}"
                previous_state="$state"
              fi
              active_count="$(jq '[.[] | select(.status != "completed")] | length' <<< "$native_runs")"
              failure_url="$(jq -r 'sort_by(.id) | last | select(.status == "completed" and (.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "action_required" or .conclusion == "startup_failure")) | .html_url // empty' <<< "$native_runs")"
              if [ "$active_count" -eq 0 ] && [ -n "$failure_url" ]; then
                failed_polls=$((failed_polls + 1))
                if [ "$failed_polls" -ge 3 ]; then
                  echo "::error::The native Pages deployment failed: ${failure_url}"
                  exit 1
                fi
              else
                # A cancelled duplicate is harmless while its replacement runs.
                failed_polls=0
              fi
            fi
            sleep 5
          done
          echo '::error::Timed out after 10 minutes waiting for the expected native Pages deployment.'
          exit 1

      - name: Verify every public application asset matches the source
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            all_verified=true
            while IFS= read -r asset || [ -n "$asset" ]; do
              [[ -z "$asset" || "$asset" == \#* ]] && continue
              live_path="$RUNNER_TEMP/pid-live/$asset"
              mkdir -p "$(dirname "$live_path")"
              if ! curl --fail --silent --show-error --location --connect-timeout 10 --max-time 20 "https://tront.xyz/pid/${asset}?sha=${GITHUB_SHA}&attempt=${attempt}" --output "$live_path" || ! cmp -s "$asset" "$live_path"; then
                echo "Waiting for the published ${asset} to match ${GITHUB_SHA}."
                all_verified=false
                break
              fi
            done < PUBLIC_ASSETS.txt
            if [ "$all_verified" = true ]; then
              echo 'Verified every declared public asset, including WebXR, the tutorial and Unity ZIP, matches this commit byte for byte.'
              sha256sum index.html vr/index.html vr/app.js vr/physics.js tutorial/index.html downloads/TrontPhysicsGym-Unity.zip
              echo "Published and verified [Physics Gym](https://tront.xyz/pid/), [Grab Lab](https://tront.xyz/pid/vr/) and [Unity tutorial](https://tront.xyz/pid/tutorial/) from commit ${GITHUB_SHA}." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo '::error::The public application assets did not match the source before the verification timeout.'
          exit 1

