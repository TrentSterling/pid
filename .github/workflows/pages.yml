name: Publish and verify Physics Gym

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pid-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate the static application
        shell: bash
        run: |
          set -euo pipefail
          for asset in index.html styles.css app.js sim.js scene.js canvas-scene.js; do
            test -s "$asset"
          done
          test -f .nojekyll
          for module in app.js sim.js scene.js canvas-scene.js; do
            node --input-type=module --check < "$module"
          done
          node tests/simulation.mjs

      - name: Fast-forward the publishing branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          if ! git merge-base --is-ancestor origin/gh-pages "$GITHUB_SHA"; then
            echo '::error::gh-pages has independent commits. Reconcile them before publishing; no history was overwritten.'
            exit 1
          fi
          git push origin "$GITHUB_SHA:refs/heads/gh-pages"

      - name: Request and await the exact Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # GITHUB_TOKEN pushes do not trigger a Pages build automatically.
          previous_created="$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" --jq '.created_at' 2>/dev/null || true)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --jq '{status: .status, url: .url}'
          for attempt in {1..60}; do
            if build="$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" --jq '[.status, .commit, .created_at] | @tsv')"; then
              read -r status commit created <<< "$build"
              if [ "$commit" = "$GITHUB_SHA" ] && [ "$status" = 'built' ]; then
                echo "GitHub Pages built ${GITHUB_SHA}."
                exit 0
              fi
              if [ "$commit" = "$GITHUB_SHA" ] && [ "$status" = 'errored' ] && [ "$created" != "$previous_created" ]; then
                echo '::error::The requested GitHub Pages build failed.'
                exit 1
              fi
            fi
            sleep 5
          done
          echo '::error::Timed out waiting for the expected Pages commit.'
          exit 1

      - name: Verify every public application asset matches the source
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            all_verified=true
            for asset in index.html styles.css app.js sim.js scene.js canvas-scene.js; do
              if ! curl --fail --silent --show-error --location --connect-timeout 10 --max-time 20 "https://tront.xyz/pid/${asset}?sha=${GITHUB_SHA}&attempt=${attempt}" --output "$RUNNER_TEMP/pid-live-${asset}" || ! cmp -s "$asset" "$RUNNER_TEMP/pid-live-${asset}"; then
                echo "Waiting for the published ${asset} to match ${GITHUB_SHA}."
                all_verified=false
                break
              fi
            done
            if [ "$all_verified" = true ]; then
              echo 'Verified all six live HTML, CSS and JavaScript assets match this commit byte for byte.'
              sha256sum index.html styles.css app.js sim.js scene.js canvas-scene.js
              echo "Published and verified [Physics Gym](https://tront.xyz/pid/) from commit ${GITHUB_SHA}." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo '::error::The public application assets did not match the source before the verification timeout.'
          exit 1

